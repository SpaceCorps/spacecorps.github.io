<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · SpaceCorps</title>
  <link rel="canonical" href="https://spacecorps.github.io/404.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="tokens.css">
  <style>
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      background-image: radial-gradient(circle at 50% 50%, rgba(0, 204, 146, 0.12), transparent 70%);
    }
    .box {
      max-width: 520px;
      padding: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-boxes, 8px);
      backdrop-filter: blur(12px);
    }
    h1 { font-size: 4rem; margin: 0 0 12px 0; color: var(--ivy-green); }
    h2 { font-size: 1.5rem; margin: 0 0 16px 0; color: var(--foreground); }
    p { color: var(--muted-foreground); margin-bottom: 24px; line-height: 1.6; }
    a {
      display: inline-block;
      background: var(--ivy-green);
      color: #000000;
      padding: 12px 24px;
      border-radius: var(--radius-fields, 6px);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    a:hover {
      background: #00e6a5;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Signal Lost in Deep Space</h2>
    <p>The page or documentation resource you are looking for does not exist or has been moved across the SpaceCorps fleet.</p>
    <a href="/">&larr; Return to SpaceCorps Developer Hub</a>
  </div>
</body>
</html>
